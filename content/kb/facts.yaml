strategy:                               # 사업 방향 결정 (2026-09-16 대표 확인)
  textbook_model: 통합형                 # 독립 안전 교과서 아님 — 전공 교과서 각 단원에 안전 소절 통합
  basis: 기초연구 보고서 해외 비교(미국·OECD·일본) — 독립 교과목보다 기술 교과목·실습 통합이 대부분
  implication: "2027 교과서 제작 = 신규 전공교과서 안전 소절 통합(plans_2027.textbook_support). 2028 검정교과서 목표는 통합형 소절의 표준 모듈화·확산·인정 절차 협의로 해석. 2차년도 사업계획(연속지원 서류)에 반영 필요"

