units:
  - id: research
    name: 노동안전보건교과서 기초연구
    short: 기초연구
    period: { start: 2026-02, end: 2026-11 }
    budget:
      total: 13200000
      사업인건비: 10840000
      사업회의비: 1100000
      도서인쇄비: 760000
      지급수수료: 500000
    activities:
      - 기초연구 보고서 제작 (국립대 교수 초빙 연구팀, 전문 기술교정 포함)
      - 반도체고 NCS 자료 86종·교과서 9종 노동안전 관점 분석
      - 당사자 인터뷰 10회 (학생·졸업생·노동자)
      - 반도체 대기업 현장노동자 설문조사
      - 성과공유 교육·토론회 4회 운영 (3단체 공동기획)
      - 보고서 300부 인쇄·배포 (학교·국회·노동부·교육청)
    analysis_scope: { ncs_materials: 86, textbooks: 9 }          # 2026-09-15 사용자 확인
    survey: { target: 반도체 대기업 현장노동자, n: 48, note: "설문 대상 기업 실명은 kb·산출물 모두 미기재 — '반도체 대기업'으로 표기" }
    findings:                            # 기초연구 보고서 초안 2026-09-11 (data/반도체 기초보고서_20260911.hwpx) — 발간본에서 재확인
      report_title: 반도체고등학교 노동안전교과서 제작을 위한 기초연구보고서
      textbooks_analyzed: 9
      accident_cases_in_textbooks: 0     # 9권 전체에서 구체적 사고 사례 0건
      keywords_not_found: [공정안전관리, 직업병, 물질안전보건자료, 추락]
      safety_keyword_formal_pct: 32.1    # '안전' 3,405건 중 등급1(형식적 언급) 1,094건
      survey_n: 48
      survey_no_edu_pct: 39.6            # 고교 재학 중 안전보건교육 전혀 없음
      survey_sometimes_pct: 37.5
      survey_semiconductor_edu_pct: 10.4 # 반도체·전자 유해요인 교육 경험
      survey_need_pct: 77.1              # 기술계 고교 안전보건교육 개설 필요
      survey_format_split: { 별도 정규과목: 33.3, 전공·실습 과목 내 포함: 33.3 }   # 동률 — 방식 우열 근거로 쓰지 말 것
      overseas:
        countries: [미국(CTE·OSHA 10-hour), 독일·스위스·오스트리아·스웨덴·덴마크·핀란드(OECD), 일본]
        finding: 산업 안전보건교육은 독립 교과목보다 기술 교과목·실습 교육에 통합되는 경우가 대부분 (보고서 표 17)
      proposed_structure: [공정·직무별 위험 요인, 노출·사고 발생 과정, 건강 영향, 예방 대책, 비상 대응]
      report_toc_chapters: 15            # 교과서 목차(안) — 통합형 소절의 내용 체계로 활용
      process_chemicals:                 # 보고서 표3 (공정 / 물질 / 노출경로 / 건강영향)
        - { process: 웨이퍼 세정, chemicals: [황산, 과산화수소, 암모니아, 불산], exposure: [증기 흡입, 피부 접촉], effects: [피부 화상, 호흡기 자극, 불산 전신 독성] }
        - { process: 포토리소그래피, chemicals: [포토레지스트, PGMEA, 톨루엔, 자일렌], exposure: [증기 흡입, 피부 접촉], effects: [중추신경계 영향, 피부염, 간·신장 영향] }
        - { process: 식각, chemicals: [염소, 불화수소, 삼불화질소], exposure: [가스 흡입], effects: [폐 자극, 화학적 폐 손상] }
        - { process: 박막 증착(CVD), chemicals: [실레인, 포스핀, 다이보레인], exposure: [가스 흡입], effects: [급성중독, 폐 손상, 신경계 영향] }
        - { process: 이온주입, chemicals: [비소, 인, 붕소 화합물], exposure: [분진 흡입, 피부 접촉], effects: [발암성(비소), 피부·신경계 영향] }
        - { process: CMP, chemicals: [실리카 슬러리, 산·알칼리], exposure: [분진 흡입, 피부 접촉], effects: [호흡기 자극, 피부염] }
        - { process: 검사, chemicals: [엑스선 장비], exposure: [방사선], effects: [피부 손상, 장기 노출 시 암 위험] }
        - { process: 패키징, chemicals: [납, 플럭스, 에폭시수지], exposure: [흄 흡입, 피부 접촉], effects: [납중독, 호흡기 자극, 피부 알레르기] }
    outputs: [기초연구 보고서(약 71쪽), 교과서 집필 방향안]
