  - {a: kb/02-단위사업/AI학습동아리.md#현행-목표, l: 14, e: 17, c: 141, s: '학교 현장의 관심이 높은 AI 학습(바이브코딩)을 매개로, 학생들이 만들고 싶은 기능과 학습도구를 직접 만들면서 그 안에 노동안전 내용이 스며들도록 한다. 올해는 1개 학교에서 모델을 잘 만들어 내년에 확산한다.', k: [학교, ai, 관심, 기능, 내년, 노동안전, 높은, 만들고]}
