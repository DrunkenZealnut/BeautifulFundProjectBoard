  - {a: kb/02-단위사업/기초연구.md#기초연구-보고서-초안-주요-결과, l: 62, e: 72, c: 1098, s: '국내 교과서 9권 + NCS 86종 키워드 분석: 구체적 사고 사례 0건. 공정안전관리·직업병·물질안전보건자료·추락 키워드 미검출. ''안전'' 3,405건 중 32.1%는 형식적 언급(등급1). 기술·공정 원리 중심,', k: [기초연구, 사고, 직업병, 공정, 안전보건교육, 화학물질, ghs, ppe]}
  - {a: kb/02-단위사업/기초연구.md#향후-연결, l: 73, e: 90, c: 1009, s: 보고서를 바탕으로 2차년도 노동안전보건교과서 본 제작 → 3차년도 검정교과서 신청. 보고서는 교사용 학습참고자료·교과서 활용 협의의 근거 자료로도 활용., k: [기초연구, 교과서, 소절, 안전, 제작, 차년, 개교, 규모]}
  - {a: kb/02-단위사업/기초연구.md#향후-연결/2027-반도체고-신규-전공교과서-제, l: 77, e: 90, c: 904, s: '사업 방향 (2026-09-16 결정, facts.strategy): 센터의 노동안전보건교과서는 독립 교과서가 아니라 통합형 — 전공 교과서 각 단원에 안전 소절을 넣는다. 근거는 기초연구 해외 비교. 따라서 아래 ', k: [기초연구, 교과서, 소절, 안전, 개교, 규모, 전공, 제작]}
  - {a: kb/02-단위사업/기초연구.md#변경-배경, l: 91, e: 94, c: 178, s: '당초 계획은 보고서 제작 외 연관 활동이 없었다. 중간평가에서 보고서의 완성도(기술교정)와 사회적 확산(토론회 4회)이 추가되었고, 연구팀이 활동가 중심에서 국립대 교수 초빙으로 바뀌면서 예산이 9,100,000원에', k: [보고서, md, 교수, 국립대, 기술교정, 늘었다, 당초, 문단]}
