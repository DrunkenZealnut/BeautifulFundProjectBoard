  - {a: kb/01-사업개요.md#1, l: 16, e: 22, c: 454, s: '''반도체특별법'' 논쟁은 주52시간제 예외와 물·전기 부족에 집중되었지만, 전국에 생겨나는 반도체고를 졸업해 반도체회사에 취업하는 청년노동자의 노동안전보건에는 노동운동도 기후운동도 관심을 갖기 어려웠다.', k: [관심, 반도체고, 일할, 가능성, 각자도생, 갖기, 갖지, 건강하게]}
