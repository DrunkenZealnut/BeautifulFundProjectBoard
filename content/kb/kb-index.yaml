  - {a: kb/02-단위사업/지역협력.md#현행-목표, l: 14, e: 17, c: 126, s: '지역별 특성에 맞게 협력 방식을 다양하게 기획한다. 지역단체의 범위를 민간에서 민간위탁기관(노동자종합지원센터)으로 확대하고, 활동가 모임이 있는 지역에서는 교육활동가 양성과정을 우선 추진한다.', k: [교육활동, 기획한다, 다양하게, 맞게, 모임, 목표, 민간, 민간위탁기관]}
