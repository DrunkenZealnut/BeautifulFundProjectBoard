# kb-select 설정 — /kihoek 서브커맨드별 기본 앵커 (사람이 관리)
# 앵커 표기: 정규 `kb/<파일>#<번호|텍스트>[/<하위>]` · 약식 `NN#…`(kb/NN-*.md) · `02/<파일명>#…` · `#*`(## 전부)
# `{unit}.kb#*` = --unit 의 02 파일 전체, `{unit}.h09` = 09 §1 소절. --unit 이 없으면 {unit} 항목은 건너뜀
# 설계: docs/02-design/features/사업기획-AI-도우미.design.md §4.2

units:                                  # facts.units[].id → 02 파일 · 09 §1 소절 (09 소절 순서는 설계 §3.2 고정)
  research: { kb: "kb/02-단위사업/기초연구.md",       h09: "kb/09-성과실적.md#1/1.1" }
  app:      { kb: "kb/02-단위사업/노동안전보건APP.md", h09: "kb/09-성과실적.md#1/1.2" }
  campaign: { kb: "kb/02-단위사업/캠페인.md",         h09: "kb/09-성과실적.md#1/1.3" }
  ai-club:  { kb: "kb/02-단위사업/AI학습동아리.md",   h09: "kb/09-성과실적.md#1/1.4" }
  regional: { kb: "kb/02-단위사업/지역협력.md",       h09: "kb/09-성과실적.md#1/1.5" }
  org:      { kb: null, kb_fallback: ["01#5", "01#6", "04#1"], h09: "kb/09-성과실적.md#1/1.6" }   # 02 파일 없음

defaults:
  status:   ["09#5", "10#4"]
  # idea: G3(02 활동 매핑)은 색인 s·k 로 1차 판정. --unit 이면 그 02 파일 전체를 추가
  idea:     ["01#1", "01#2", "01#8", "04#1", "04#2", "05#1", "05#3", "08#4", "08#7", "09#1", "09#5", "10#4", "10#5", "{unit}.kb#*"]
  plan:     ["01#1", "01#2", "01#8", "{unit}.kb#*", "03#1", "03#2", "04#*", "07#2", "08#3", "08#4", "08#7", "{unit}.h09", "10#1", "10#2", "10#3", "10#5"]
  proposal: ["01#*", "{unit}.kb#*", "03#1", "04#*", "05#1", "06#1", "06#2", "08#1", "08#5", "09#1", "09#2"]
  review:   ["03#1", "03#2", "04#*", "07#2", "08#*"]
  learn:    ["07#2", "09#*", "10#*"]
