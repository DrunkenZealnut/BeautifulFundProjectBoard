template: notice-a4
slots:
  eyebrow: "동아리 모집 안내"
  title: "AI 학습동아리 참여 학생을 모집합니다"
  lead: "AI(바이브코딩)로 내가 원하는 앱과 학습도구를 직접 만드는 동아리입니다. 코딩 경험은 필요 없어요."
  facts:
    - { k: "대상", v: "반도체 관련 학과 재학생 5명 내외" }
    - { k: "기간", v: "2026년 10월 ~ 12월 (5개월 서비스 지원)" }
    - { k: "장소", v: "교내 또는 학교 밖 공간, 온라인 소통방 병행" }
    - { k: "지원", v: "AI 코딩 서비스 이용료, 서버·DB, 도서, 자문" }
  sections:
    - { h: "무엇을 하나요", body: "각자 만들고 싶은 기능이나 우리 학교에 필요한 학습도구를 정하고, AI 코딩 도구로 직접 만들어 봅니다. 만드는 과정에서 현장의 안전 정보(유해물질, 보호구, 사고 사례)를 자연스럽게 다룹니다." }
    - { h: "어떻게 진행되나요", body: "월 1~2회 모임(다과 제공)과 온라인 소통방으로 진행합니다. 청년노동자인권센터 대표와 자문위원이 제작을 돕고, 완성한 결과물은 학교와 함께 공유합니다." }
    - { h: "신청 방법", body: "담당 선생님께 말씀하시거나 아래 안내된 방법으로 신청하세요. 선착순이 아니라 관심 위주로 함께할 친구를 찾습니다." }
  contact_note: "문의: 청년노동자인권센터 (연락처는 최종본에 기입)"
  credit: "이 활동은 아름다운재단 지원으로 진행됩니다."
