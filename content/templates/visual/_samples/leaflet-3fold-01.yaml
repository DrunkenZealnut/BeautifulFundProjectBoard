template: leaflet-3fold
slots:
  cover:
    eyebrow: "전공교사용 안내"
    title: "수업에 바로 쓰는 반도체 안전 학습자료"
    tagline: "교과서 기반 학습자료 · 영상 · 챗봇을 무료로 제공합니다"
  intro:
    title: "청년노동자인권센터"
    body: "반도체·제조업 청년노동자에게 안전할 지식(교과서)과 스스로를 지킬 도구(APP)를 제공하는 노동안전 전문단체입니다. 반도체고 학생이 현장의 첫날을 안전하게 맞을 수 있도록 학교와 함께합니다."
  back:
    title: "함께합니다"
    body: "이 홍보물은 아름다운재단 지원으로 제작되었습니다. 아름다운재단 공익단체 인큐베이팅 지원사업은 새로 시작하는 공익단체가 3년간 자립 기반을 만들도록 지원합니다."
    links:
      - { label: "학습자료", url: "safefactory.kr" }
      - { label: "문의", url: "(연락처는 최종본에 기입)" }
  panels:
    - title: "교과서 기반 학습자료"
      body: "반도체고 교과서의 안전 관련 단원을 노동안전보건 관점으로 정리한 자료입니다. 수업 보조자료, 과제, 토론 주제로 활용하세요."
      list:
        - { text: "단원별 핵심 요약 PDF" }
        - { text: "학습용 이미지·영상" }
        - { text: "MSDS 읽는 법 워크시트" }
      links:
        - { label: "자료창고", url: "safefactory.kr" }
    - title: "반도체 안전 챗봇"
      body: "학생이 궁금한 것을 물어보면 교육자료를 근거로 답합니다. 실습 전 사전학습, 수행평가 준비에 쓸 수 있습니다."
      list:
        - { text: "교과서·매뉴얼 기반 답변" }
        - { text: "유해인자·보호구 검색" }
      links:
        - { label: "챗봇", url: "safefactory.kr" }
    - title: "학교와 함께하는 활동"
      body: "커피차 캠페인, AI 학습동아리, 기초연구보고서 공유 토론회 등 학교 일정에 맞춰 부담 없이 진행할 수 있는 활동을 제안합니다."
      list:
        - { text: "커피차 캠페인 (축제·동아리의 날)" }
        - { text: "AI 학습동아리 지원" }
        - { text: "노동안전보건 교과서 기초연구" }
  credit: "아름다운재단 2026 공익단체 인큐베이팅 지원사업"
