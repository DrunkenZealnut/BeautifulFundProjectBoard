<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="promo-size" content="1080x1350">
<meta name="promo-slots" content='{"eyebrow":16,"title":20,"body":120,"cta":16,"date":30,"credit":40}'>
<!--
  card-portrait — 1080×1350 인스타그램 4:5 (모집·안내)
  슬롯: eyebrow · title · body · cta · date · credit · photo (선택) · logo_org · logo_funder
  photo 없으면 상단 영역은 그라디언트 + 큰 제목
-->
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  .card { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
  .hero { position: relative; height: 620px; background: var(--grad-2); overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero .badge { position: absolute; left: var(--pad); top: 56px; }
  .hero .badge .chip { font-size: var(--t-body); padding: 0.4em 1em; background: var(--ink); color: #fff; }
  .hero.nophoto::after { content: ""; position: absolute; right: -120px; bottom: -160px; width: 460px; height: 460px; border-radius: 50%; background: var(--accent2); opacity: 0.9; }
  .hero.nophoto .deco { position: absolute; left: var(--pad); bottom: 56px; width: 220px; height: 220px; border-radius: 40px; background: var(--accent); transform: rotate(-8deg); }
  .content { flex: 1; display: flex; flex-direction: column; padding: 56px var(--pad) var(--pad); }
  .title { font-size: 72px; }
  .body { margin-top: 26px; color: #333; }
  .cta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-top: 32px; }
  .cta .btn { display: inline-block; padding: 0.55em 1.2em; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; font-size: var(--t-sub); }
  .cta .date { font-size: var(--t-body); font-weight: 700; color: var(--ink); text-align: right; }
  .credit-row { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="card">
  <div class="hero {{^photo}}nophoto{{/photo}}">
    {{#photo}}<img src="{{photo}}" alt="">{{/photo}}
    {{^photo}}<div class="deco"></div>{{/photo}}
    {{#eyebrow}}<div class="badge"><span class="chip">{{eyebrow}}</span></div>{{/eyebrow}}
  </div>
  <div class="content">
    <h1 class="title">{{title}}</h1>
    {{#body}}<p class="body">{{body}}</p>{{/body}}
    <div class="cta">
      {{#cta}}<span class="btn">{{cta}}</span>{{/cta}}
      {{#date}}<span class="date">{{date}}</span>{{/date}}
    </div>
    <div class="credit-row">
      <div class="logos">
        {{#logo_funder}}<img src="{{logo_funder}}" alt="아름다운재단">{{/logo_funder}}
        {{#logo_org}}<img src="{{logo_org}}" alt="청년노동자인권센터">{{/logo_org}}
        {{^logo_org}}<span class="wordmark">청년노동자인권센터</span>{{/logo_org}}
      </div>
      <div class="credit">{{credit}}</div>
    </div>
  </div>
</div>
</body>
</html>
